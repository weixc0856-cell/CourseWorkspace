[project]
name = "course-control"
version = "0.1.0"
description = "Course production control layer for CourseWorkspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-runtime",
    "pillow>=10,<12",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "scene-expr",
    "typer>=0.12,<1",
]

[tool.uv.sources]
ai-runtime = { path = "../shared/ai_runtime", editable = true }
scene-expr = { path = "../shared/scene_expr", editable = true }

[project.scripts]
course-control = "course_control.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_control"]
