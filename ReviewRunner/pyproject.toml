[project]
name = "review-runner"
version = "0.1.0"
license = {text = "AGPL-3.0-or-later"}
description = "Independent read-only second-opinion review runner for CourseWorkspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-runtime",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.scripts]
review-runner = "review_runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_runner"]

[tool.uv.sources]
ai-runtime = { path = "../shared/ai_runtime", editable = true }
