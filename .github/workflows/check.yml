name: check

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            CourseSlides/package-lock.json
            MotionStudio/package-lock.json
            RemotionStudio/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ChocolateyInstall\bin"

      - name: Python dependencies
        shell: pwsh
        run: |
          uv sync --locked --project CourseControl
          uv sync --locked --project ModelingStudio
          uv sync --locked --project shared/ai_runtime
          uv sync --locked --project ContentQA
          uv sync --locked --project ManimSandbox
          uv sync --locked --project KnowledgeStudio

      - name: Node dependencies
        shell: pwsh
        run: |
          Push-Location CourseSlides; npm ci; Pop-Location
          Push-Location MotionStudio; npm ci; Pop-Location
          Push-Location RemotionStudio; npm ci; Pop-Location

      - name: Vendor sync
        shell: pwsh
        run: uv run --project CourseControl course-control vendor-sync --workspace .

      - name: Unit tests
        shell: powershell
        run: |
          $projects = @("CourseControl", "ModelingStudio", "shared/ai_runtime", "ContentQA", "ManimSandbox", "KnowledgeStudio")
          foreach ($project in $projects) {
            Write-Host "unit tests: $project"
            $python = Join-Path $project ".venv\Scripts\python.exe"
            & $python -m unittest discover -s "$project/tests" -t $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run check.ps1
        shell: powershell
        run: .\scripts\check.ps1 -CleanClone -SkipUnitTests
