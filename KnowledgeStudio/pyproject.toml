[project]
name = "knowledge-studio"
version = "0.1.0"
license = {text = "AGPL-3.0-or-later"}
description = "Textbook ingestion, page-level knowledge units and traceable retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "pypdf==6.9.2",
    "typer>=0.12,<1",
]

[project.scripts]
knowledge-studio = "knowledge_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_studio"]
