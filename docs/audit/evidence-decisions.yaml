schema_version: 1

# Disposition for build/ paths that docs reference but no longer exist.
# A missing path is closed only when it matches a rule below.
# Longest matching prefix wins.
# Dispositions: retained / regenerable / retired_poc / historical / stale_ref / external
rules:
  - prefix: build/01-shell-for-ai-era
    disposition: regenerable
    owner: CourseControl
    reason: "Lesson content is present but no build exists on this machine; rerun build-lesson.ps1 -Lesson 01-shell-for-ai-era."

  - prefix: build/01-transformer-demo/delivery/
    disposition: historical
    owner: docs
    reason: "Producer manifest moved to build/<slug>/producer/ by D-085; historical session records keep the old path."

  - prefix: build/01-transformer-demo/package/
    disposition: historical
    owner: docs
    reason: "Delivery package moved to deliver/01-transformer-demo/ by D-085; session records keep the old path."

  - prefix: build/05-transformer-5min/delivery/
    disposition: historical
    owner: docs
    reason: "Producer manifest moved to build/<slug>/producer/ by D-085; historical session records keep the old path."

  - prefix: build/01-transformer-demo/authoring/candidates/
    disposition: regenerable
    owner: authoring
    reason: "Candidate drafts are intermediate files; author-accept promotes them into lessons/."

  - prefix: build/01-transformer-demo/narration/audition/
    disposition: regenerable
    owner: narrate
    reason: "Audition samples are regenerated by narration-build --sample."

  - prefix: build/01-transformer-demo/subtitles/bilingual.draft
    disposition: stale_ref
    owner: docs
    reason: "The draft is written as bilingual.draft.json/.srt/.vtt; the extensionless path is a documentation shorthand."

  - prefix: build/01-transformer-demo/tmp/
    disposition: regenerable
    owner: CourseControl
    reason: "Manim media cache; recreated by the next render."

  - prefix: build/audit-
    disposition: historical
    owner: docs
    reason: "Temporary audit frames and logs were cleaned after the 2026-11-10 review; the report records the result."

  - prefix: build/02-car-aerodynamics/
    disposition: regenerable
    owner: CourseControl
    reason: "Lesson build is not retained; rerun build-lesson.ps1 -Lesson 02-car-aerodynamics."

  - prefix: build/05-transformer-5min/quality/quality-report
    disposition: stale_ref
    owner: docs
    reason: "The artifact is quality-report.json; the doc refers to the stem."

  - prefix: build/_spike-r2/
    disposition: retired_poc
    owner: docs
    reason: "R2 spike directory was deleted after the decision was recorded."

  - prefix: build/accept/
    disposition: retired_poc
    owner: docs
    reason: "Manual burn-in acceptance directory; superseded by burn_subtitles stage."

  - prefix: build/aging-evolution/aging.json
    disposition: stale_ref
    owner: docs
    reason: "The plan document names an output file that the shot writes under a different name."

  - prefix: build/backend-compare/
    disposition: retired_poc
    owner: docs
    reason: "Four-backend comparison; result is recorded in evaluations/评估-四后端对比.md."

  - prefix: build/blender-scene-acceptance/
    disposition: retired_poc
    owner: docs
    reason: "IR v2 acceptance render; contract is covered by scene-validate tests."

  - prefix: build/claims.json
    disposition: stale_ref
    owner: docs
    reason: "KnowledgeStudio writes claims under its own build root; this top-level path never existed."

  - prefix: build/code-video-poc/
    disposition: retired_poc
    owner: docs
    reason: "Code2Video POC; the production path is render:code_video."

  - prefix: build/code-video-qc2/
    disposition: retired_poc
    owner: docs
    reason: "Second CodeVideo QC run; result recorded in the audit, not retained."

  - prefix: build/code-video-studio/
    disposition: regenerable
    owner: CourseControl
    reason: "Produced by render:code_video; rerun the lesson build."

  - prefix: build/formulas/CFD-001
    disposition: regenerable
    owner: CourseControl
    reason: "Produced by formula-render; rerun the documented command."

  - prefix: build/harness-compare/
    disposition: retired_poc
    owner: docs
    reason: "DeepSeek harness comparison; result recorded in evaluations/评估-DeepSeek Harness.md."

  - prefix: build/manim-fft/
    disposition: retired_poc
    owner: docs
    reason: "FFT demo render; the scene is still in ManimSandbox and can be re-rendered on demand."

  - prefix: build/manim-multi-head/
    disposition: historical
    owner: docs/archive
    reason: "E6.5 archive evidence; the archive records the result and the source remains in ManimSandbox."

  - prefix: build/manim-transformer/
    disposition: historical
    owner: docs/archive
    reason: "E6 / V1 archive evidence; the archive records the result and the source remains in ManimSandbox."

  - prefix: build/narration/
    disposition: stale_ref
    owner: docs
    reason: "Narration lives under build/<lesson>/narration/; the top-level path is a shorthand."

  - prefix: build/p1b-annotation-evidence/
    disposition: retired_poc
    owner: docs
    reason: "Annotation evidence POC; annotation checks are covered by V-22 tests."

  - prefix: build/p3-legend-evidence/
    disposition: retired_poc
    owner: docs
    reason: "Legend evidence POC; legend checks are covered by V-22 tests."

  - prefix: build/r1-smoke/
    disposition: historical
    owner: docs/archive
    reason: "R1 engine smoke evidence; the archive records the result."

  - prefix: build/r1/
    disposition: historical
    owner: docs/archive
    reason: "R1 baseline and benchmark evidence; the archive records the result."

  - prefix: build/report.json
    disposition: stale_ref
    owner: docs
    reason: "Reports live under build/<lesson>/final/build-report.json."

  - prefix: build/tmp/
    disposition: stale_ref
    owner: docs
    reason: "Temporary directory; never a durable evidence path."

  - prefix: build/videozero-poc/
    disposition: retired_poc
    owner: docs
    reason: "VideoZero POC; not merged into the production path."

  - prefix: build/x.png
    disposition: stale_ref
    owner: docs
    reason: "Placeholder path in a documentation example."

  - prefix: build/01-transformer-demo/final/
    disposition: regenerable
    owner: CourseControl
    reason: "Media intermediates cleaned on 2026-11-11 with user approval; deliver/01-transformer-demo/ holds the master. Rerun build-lesson.ps1 -Lesson 01-transformer-demo to regenerate."

  - prefix: build/01-transformer-demo/narration/
    disposition: regenerable
    owner: narrate
    reason: "Narration media cleaned on 2026-11-11 with user approval; regenerate with narration-build."

  - prefix: build/05-transformer-5min/final/
    disposition: regenerable
    owner: CourseControl
    reason: "Media intermediates cleaned on 2026-11-11 with user approval; deliver/05-transformer-5min/ holds the master. Rerun build-lesson.ps1 -Lesson 05-transformer-5min to regenerate."

  - prefix: build/05-transformer-5min/narration/
    disposition: regenerable
    owner: narrate
    reason: "Narration media cleaned on 2026-11-11 with user approval; regenerate with narration-build."

  - prefix: build/05-transformer-5min/quality/frames/
    disposition: regenerable
    owner: CourseControl
    reason: "QC frame samples cleaned on 2026-11-11 with user approval; regenerate with quality-report / media-qc."

  - prefix: build/06-attention-sample/final/
    disposition: regenerable
    owner: CourseControl
    reason: "Media intermediates cleaned on 2026-11-11 with user approval; deliver/06-attention-sample/ holds the master. Rerun build-lesson.ps1 -Lesson 06-attention-sample to regenerate."

  - prefix: build/nvda-gpu-control/final/
    disposition: regenerable
    owner: CourseControl
    reason: "Media intermediates cleaned on 2026-11-11 with user approval; deliver/nvda-gpu-control/ holds the master. Rerun build-lesson.ps1 -Lesson nvda-gpu-control to regenerate."
