schema_version: 1

# Claude Code is the primary backend; set backend=local_first to opt out.
# If Claude Code is unavailable, this fails loudly unless
# claude_code_fallback: "local_first".
backend: "claude_code"
claude_code_fallback: "none"

# Local-only authoring config (ignored by git). Copy this file and fill paths.
# The local model is always tried first; remote fallback is read from
# config/model-routing.yaml and is only used when explicitly enabled.

server:
  executable: "<AI_ROOT>/bin-sycl/llama-server.exe"
  host: "127.0.0.1"
  port: 8080
  startup_timeout_s: 300
  stop_timeout_s: 30

model:
  path: "<AI_ROOT>/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
  alias: "Qwen3-30B-A3B-Instruct-2507"
  context: 32768
  args: ["-ngl", "0", "--reasoning", "off"]

llm:
  context_limit: 32768
  reserved_output: 4096
  request_timeout_s: 900
  max_retries: 1
  temperature: 0.2
  # DeepSeek flash spends max_tokens on reasoning unless disabled; keep
  # long structured drafts from returning empty content.
  remote_thinking: "disabled"

runtime:
  lock_path: "runtime/locks/llama-8080.lock"
  task_root: "runtime/tasks"
  lock_timeout_s: 3600
  stale_after_s: 3600
