ai_root: "<AI_ROOT>"
blender_exe: "<BLENDER_EXE>"
workspace: "<WORKSPACE>"
reference_project: "<REFERENCE_PROJECT>"
local_drama_root: "<LOCAL_DRAMA_ROOT>"
tts:
  runtime_dir: "<AI_ROOT>/VoxCPM-Runtime"
  voice_ref: "<VOICE_REF_WAV>"
  prompt_text: "<REFERENCE_TRANSCRIPT>"
  # Optional English reference for English narration (3-5 s, clean, authorized).
  # Falls back to voice_ref when empty.
  voice_ref_en: "<EN_VOICE_REF_WAV>"
  prompt_text_en: "<EN_REFERENCE_TRANSCRIPT>"
  auto_start: true
  wait_timeout_s: 1800
bgm_root: <BGM_LIBRARY_ROOT>
docling_root: "<DOCLING_ROOT>"
source_libraries:
  automotive-aerodynamics: "<SOURCE_LIBRARY_ROOT>"

# 课程内容与产物根（物理隔离；lessons / build / deliver / runtime / knowledge / projects 不在代码仓库内）
# 本地典型配置：工作区内联接目录 ./content_data 或本地自定义路径（在 local-paths.yaml 中按需填写）
content_root: "<CONTENT_ROOT>"
