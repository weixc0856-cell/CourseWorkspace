schema_version: 1

# Copy to config/model-routing.yaml (git-ignored) and fill local values.
# This is provider-agnostic: any OpenAI-compatible endpoint works.
# NEVER put an API key in this file; name the environment variable instead.
remote:
  enabled: true
  provider: "openai-compatible"   # or "deepseek", "openai", etc.
  base_url: "<OPENAI_COMPATIBLE_BASE_URL>"
  model: "<MODEL_ID>"
  api_key_env: "<API_KEY_ENV_VAR_NAME>"
  timeout_s: 120
  supports_vision: false
  vision_model: null

fallback:
  # Local 8080 busy/unavailable -> remote. Keep this explicit.
  on: ["busy", "start_error", "lock_timeout", "missing_executable"]

