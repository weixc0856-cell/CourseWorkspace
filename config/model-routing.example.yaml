schema_version: 1

# Copy to config/model-routing.yaml (ignored) and set the environment variable
# named below. Never put the API key in this file.
remote:
  enabled: true
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-flash"
  api_key_env: "DEEPSEEK_API_KEY"
  timeout_s: 120
  # DeepSeek is pinned to deepseek-flash; deepseek-v4-pro is disabled.
  # deepseek-flash supports image understanding (verified 2026-11-07).
  # Set false/null when the endpoint is text-only.
  supports_vision: true
  vision_model: "deepseek-flash"

fallback:
  # Local 8080 busy/unavailable -> remote. Keep this explicit.
  on: ["busy", "start_error", "lock_timeout", "missing_executable"]
