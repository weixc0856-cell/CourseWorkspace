[project]
name = "modeling-studio"
version = "0.1.0"
description = "Local image-to-Blender modeling workflow (Qwen3-VL / Qwen3 / Qwen3-Coder)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-runtime",
    "httpx>=0.27,<1",
    "pillow>=10,<12",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[tool.uv.sources]
ai-runtime = { path = "../shared/ai_runtime", editable = true }

[project.scripts]
modeling-studio = "modeling_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeling_studio"]
