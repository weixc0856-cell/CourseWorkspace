<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Transformer — card film</title>
<link rel="stylesheet" href="./node_modules/@fontsource/noto-sans-sc/300.css" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0A0908; }
  canvas { display: block; }
  #pre { position: absolute; left: -9999px; font-family: 'Noto Sans SC'; font-weight: 300; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="pre">也算出了你遗憾的上限只看不选从这里开始第一个更好的成功率也是注意力权重序列向量编码层残差归一化深度并行顺序代价之后起点但它得先读懂每层两个子层</div>
<script>
(async () => {
  for (const [url, weight] of [
    ['./fonts/jost-latin-200-normal.woff2', '200'],
    ['./fonts/jost-latin-300-normal.woff2', '300'],
  ]) {
    const f = new FontFace('Jost', `url(${url})`, { weight });
    await f.load();
    document.fonts.add(f);
  }
  try { await document.fonts.ready; } catch (e) {}
  const s = document.createElement('script');
  s.src = './film.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
